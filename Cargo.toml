[package]
name = "nexus-mcp-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Minimal MCP 2026-07-28 to legacy Nexus compatibility shim"
repository = "https://github.com/blogle/nexus-mcp-compat"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "=3.5.1", default-features = false, features = [
  "server",
  "client",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
